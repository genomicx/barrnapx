server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cache reference FASTA files aggressively — they never change between deploys
    location /data/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache hashed JS/CSS assets forever
    location ~* \.(js|css|woff2?|ttf|ico|png|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
